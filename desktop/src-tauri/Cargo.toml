[package]
name = "csrift-desktop"
version = "0.1.0"
description = "CSRIFT local-first desktop control center"
authors = ["CSRIFT"]
edition = "2021"

[lib]
name = "csrift_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
